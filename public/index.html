<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#091426"><meta name="robots" content="noindex"><title>Sign in · Zytrelix API Hub</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/common.js" defer></script>
  <script src="/auth.js" defer></script>
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <section id="authScreen" class="auth-shell">
    <div class="auth-brand"><div class="brand-mark">Z</div><div><strong>ZYTRELIX</strong><span>API INFRASTRUCTURE</span></div></div>
    <div class="auth-card">
      <div class="eyebrow">DEVELOPER PLATFORM</div><h1 id="authTitle">Welcome back</h1><p id="authSubtitle" class="muted">Sign in to manage your API integrations.</p>
      <form id="loginForm" class="form-stack">
        <label>Email address<input name="email" type="email" autocomplete="email" required placeholder="you@company.com"></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn primary full" type="submit">Sign in</button>
      </form>
      <form id="registerForm" class="form-stack hidden">
        <label>Your full name<input name="name" required autocomplete="name" placeholder="Jane Doe"></label>
        <label>Business name<input name="businessName" required placeholder="Your company"></label>
        <label>Business email<input name="email" type="email" required autocomplete="email" placeholder="you@company.com"></label>
        <label>Password, at least 12 characters<input name="password" type="password" minlength="12" required autocomplete="new-password"></label>
        <label>Repeat password<input name="confirmPassword" type="password" minlength="12" required autocomplete="new-password"></label>
        <button class="btn primary full" type="submit">Create business account</button>
      </form>
      <p class="auth-switch"><span id="authSwitchText">New to Zytrelix?</span> <button id="authSwitch" class="link-button" type="button">Create an account</button></p>
      <p class="auth-foot">Business registrations require platform approval before API access.</p>
    </div>
    <div class="auth-bottom">Secure API infrastructure · Sandbox by default</div>
</body></html>
